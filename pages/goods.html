<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ништяки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container-fluid p-0">
        <!-- Header -->
        <header class="bg-primary text-white py-3">
            <div class="container">
                <h1 class="h4 mb-0">Верх</h1>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                <i class="bi bi-house me-1"></i>Главная
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="news.html">
                                <i class="bi bi-newspaper me-1"></i>Новости
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="goods.html">
                                <i class="bi bi-cart me-1"></i>Товары
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacts.html">
                                <i class="bi bi-telephone me-1"></i>Контакты
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container my-4">
            <h2 class="text-center mb-4">Доступные штуки</h2>
            
            <div class="row g-4">
                <!-- Product 1 -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/goods1.jpg" class="card-img-top" alt="Фото товара 1" style="height: 250px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title h5">Первая штука</h3>
                            <p class="card-text text-muted mb-auto">
                                Описание первой штуки
                            </p>
                            <div class="mt-3">
                                <p class="h4 text-primary mb-3">5 000 ₽</p>
                                <button class="btn btn-primary w-100">
                                    <i class="bi bi-cart-plus me-2"></i>Добавить в корзину
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/goods2.jpg" class="card-img-top" alt="Фото товара 2" style="height: 250px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title h5">Штука чтобы была</h3>
                            <p class="card-text text-muted mb-auto">
                                Описание штуки которая есть
                            </p>
                            <div class="mt-3">
                                <p class="h4 text-success mb-3">0 ₽</p>
                                <button class="btn btn-success w-100">
                                    <i class="bi bi-gift me-2"></i>Получить бесплатно
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/goods3.jpg" class="card-img-top" alt="Фото товара 3" style="height: 250px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title h5">Сам не понял что это</h3>
                            <p class="card-text text-muted mb-auto">
                                Загадочная штука непонятного назначения
                            </p>
                            <div class="mt-3">
                                <p class="h4 text-warning mb-3">15 ₽</p>
                                <button class="btn btn-warning w-100">
                                    <i class="bi bi-question-circle me-2"></i>Купить неизвестное
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-dark text-white py-3 mt-5">
            <div class="container">
                <p class="mb-0 text-center">низ</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
